<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BurnoutGuard - AI-powered academic burnout prediction and monitoring platform for students. Track stress, sleep, motivation, and wellness." />
    <meta name="keywords" content="academic burnout, student wellness, stress tracker, sleep monitor, burnout prevention, AI wellness" />
    <meta name="author" content="Student Wellness Project Team" />
    <title>BurnoutGuard - Academic Burnout Prediction & Monitoring Platform</title>
    
    <!-- Open Graph -->
    <meta property="og:title" content="BurnoutGuard - Academic Burnout Prediction & Monitoring" />
    <meta property="og:description" content="AI-powered platform to monitor and prevent academic burnout in students." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burnoutguard.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BurnoutGuard - Academic Burnout Prediction & Monitoring" />
    <meta name="twitter:description" content="AI-powered platform to monitor and prevent academic burnout in students." />
    
    <link rel="canonical" href="https://burnoutguard.com" />
    
    <style>
      /* Prevent CLS from font loading */
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <!-- Google Fonts - Optimized: Only use Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before React mounts to prevent flash
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          // Default = light; clear any stale dark class
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
